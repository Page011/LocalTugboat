[package]
name = "tugboat-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Tugboat desktop app (Windows): tray, library folder, pairing"
# The installer is named from productName (Local Tugboat); the binary from mainBinaryName in tauri.conf.json (tugboat.exe).
default-run = "tugboat"

[lib]
name = "tugboat_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "tugboat"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tugboat-core = { path = "../../../crates/core", features = ["ts"] }
tauri = { version = "2.11.6", features = ["tray-icon"] }
tauri-plugin-single-instance = "2.4.5"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-opener = "2.5.5"
tauri-plugin-dialog = "2.7.3"
# native-tls = SChannel on Windows: the HTTPS check trusts the Windows certificate store (so it also works behind a
# company proxy that re-signs HTTPS with its own root). The default rustls backend ships its own roots and would not.
# No "zip" feature: the release asset is the plain installer, not an archive.
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["native-tls", "system-proxy"] }
# Already in the tree through the updater: compares the running version with the offered one.
semver = "1"
notify = "8.2.1"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
# windows-native: Credential Manager through the Win32 API, no extra daemon.
keyring = { version = "3.6.3", features = ["windows-native"] }
jpeg-encoder = "0.6.1"
# Decodes the PNG entries of the tray .ico icons (assets/brand/ico).
png = "0.18"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_System_Variant",
    "Win32_NetworkManagement_WindowsFirewall",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
blake3 = { workspace = true }
uuid = { workspace = true }
hex = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
fs4 = { workspace = true }
getrandom = { workspace = true }
ts-rs = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
tauri = { version = "2.11.6", features = ["test"] }
tempfile = { workspace = true }
