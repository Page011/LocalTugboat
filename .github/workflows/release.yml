name: Release

# Tag vX.Y.Z -> checks, build, DRAFT GitHub Release with the Windows installer, its .sha256 and latest.json
# (the file the app's update check reads) attached.
# Pull request touching this file and manual runs -> same checks and build, installer kept as a
# workflow artifact only (no release).
#
# On a tag the installer is signed for the app's update check with the key in the repository secrets
# TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD; the matching public key is
# plugins.updater.pubkey in tauri.conf.json. Only tag runs get the secrets, and only the signing step sees them
# (the build itself runs without the key). Pull request and manual runs build an unsigned installer and write
# no latest.json, so no workflow artifact outside a tag run can ever pass the app's update check.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A tag build is never cancelled half way.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # Same toolchains as the development PC.
  # Bumping RUST_VERSION can change the test-binary folder layout; crates/core/tests/pairing_flow.rs
  # fake_phone_exe() depends on target/debug/deps (cargo 1.99 layout).
  RUST_VERSION: "1.99.1"
  BUN_VERSION: "1.3.14"

jobs:
  build:
    runs-on: windows-latest
    # Tag builds are always cold (no cache from a tag ref), so allow for a long first build.
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Without the key the installer cannot be signed, and an app whose public key is still the
      # placeholder never checks for updates (and could never be updated later). Fail now, not after the build.
      - name: Update signing is set up
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -eu
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::SECRET TAURI_SIGNING_PRIVATE_KEY IS EMPTY - add the update signing key under Settings, Secrets and variables, Actions (see 'Make a release' in README.md)"
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "::error::SECRET TAURI_SIGNING_PRIVATE_KEY_PASSWORD IS EMPTY - add the password of the update signing key under Settings, Secrets and variables, Actions"
            exit 1
          fi
          pubkey=$(jq -r '.plugins.updater.pubkey // empty' apps/desktop/src-tauri/tauri.conf.json | tr -d '\r')
          if [ -z "$pubkey" ] || [ "$pubkey" = "UPDATER_PUBKEY_MISSING" ]; then
            echo "::error::UPDATE PUBLIC KEY MISSING - plugins.updater.pubkey in apps/desktop/src-tauri/tauri.conf.json is still '${pubkey:-empty}'. Put the contents of the .pub file made by 'bun run tauri signer generate' there (see 'Make a release' in README.md)"
            exit 1
          fi
          if ! printf '%s' "$pubkey" | base64 -d 2>/dev/null | head -n 1 | grep -q '^untrusted comment: minisign public key'; then
            echo "::error::UPDATE PUBLIC KEY NOT VALID - plugins.updater.pubkey must be the contents of the .pub file made by 'bun run tauri signer generate'"
            exit 1
          fi

      - name: Install Rust
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --component clippy
          rustup default "$RUST_VERSION"
          rustc --version

      # Fails loudly if Cargo.lock is stale (version bump without committing the lock).
      - name: Cargo.lock is current
        run: cargo fetch --locked

      - name: Check versions
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -eu
          # Native jq.exe on Windows writes CRLF: strip the CR from every value.
          v_conf=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json | tr -d '\r')
          v_pkg=$(jq -r .version apps/desktop/package.json | tr -d '\r')
          v_cargo=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "tugboat-desktop") | .version' | tr -d '\r')
          echo "tauri.conf.json $v_conf | package.json $v_pkg | Cargo.toml (workspace) $v_cargo"
          for v in "$v_conf" "$v_pkg" "$v_cargo"; do
            [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::BAD VERSION '$v' (empty, null or stray characters)"; exit 1; }
          done
          if [ "$v_conf" != "$v_pkg" ] || [ "$v_conf" != "$v_cargo" ]; then
            echo "::error::VERSION MISMATCH - tauri.conf.json=$v_conf, package.json=$v_pkg, Cargo.toml=$v_cargo. Set the same version in all three."
            exit 1
          fi
          if [ "$EVENT_NAME" = "push" ]; then
            if [ "$REF_NAME" != "v$v_conf" ]; then
              echo "::error::TAG MISMATCH - tag is $REF_NAME but the three files say v$v_conf. Delete the tag, fix the versions, tag again."
              exit 1
            fi
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true

      - name: Install frontend packages
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      # The Rust side embeds ../dist at compile time (tauri::generate_context), so the
      # frontend is built before clippy and the tests.
      - name: Build frontend
        working-directory: apps/desktop
        run: bun run build

      # Same commands as `bun run check` (check:ts, test, check:rust), spelled out so each is its own log step.
      - name: Check TypeScript and Svelte
        working-directory: apps/desktop
        run: bun run check:ts

      - name: Frontend tests
        working-directory: apps/desktop
        run: bun run test

      - name: Release script tests
        run: bun test ./.github/scripts

      - name: Clippy and desktop Rust tests
        working-directory: apps/desktop
        run: bun run check:rust

      # The desktop crate was just tested by check:rust; every other crate is tested here.
      - name: Rust workspace tests
        run: cargo test --workspace --exclude tugboat-desktop

      # No signing key in this step: vite, every npm package and every build script runs here. createUpdaterArtifacts
      # (tauri.conf.json) is switched off for this build; the installer is signed in its own step below.
      - name: Build installer
        working-directory: apps/desktop
        run: bun run tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Locate installer
        id: installer
        run: |
          set -eu
          shopt -s nullglob
          files=(target/release/bundle/nsis/*-setup.exe)
          if [ "${#files[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one NSIS installer in target/release/bundle/nsis, found ${#files[@]}"
            ls -la target/release/bundle/nsis || true
            exit 1
          fi
          ver=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json | tr -d '\r')
          expected="target/release/bundle/nsis/Local Tugboat_${ver}_x64-setup.exe"
          if [ "${files[0]}" != "$expected" ]; then
            echo "::error::Installer name '${files[0]}' is not the expected '$expected'"
            exit 1
          fi
          mkdir out
          cp "${files[0]}" "out/LocalTugboat_${ver}_x64-setup.exe"
          (cd out && sha256sum "LocalTugboat_${ver}_x64-setup.exe" > "LocalTugboat_${ver}_x64-setup.exe.sha256")
          # Same bytes under the published name: the signature covers the bytes, not the file name.
          cmp "${files[0]}" "out/LocalTugboat_${ver}_x64-setup.exe"
          echo "nsis=${files[0]}" >> "$GITHUB_OUTPUT"
          ls -la out

      # Tag runs only. The one step that holds the signing key and its password: only the tauri CLI sees them.
      # --app-version puts the version in the signed comment (the app refuses a manifest that announces another).
      - name: Sign installer
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: apps/desktop
        env:
          NSIS: ${{ steps.installer.outputs.nsis }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -eu
          ver=$(jq -r .version src-tauri/tauri.conf.json | tr -d '\r')
          bun run tauri signer sign --app-version "$ver" "../../$NSIS"
          if [ ! -s "../../$NSIS.sig" ]; then
            echo "::error::No update signature next to the installer: '$NSIS.sig' is missing or empty"
            exit 1
          fi

      # The file the app's update check downloads: version, release link, and the signature of the installer
      # that is attached to this release. The script verifies the signature against plugins.updater.pubkey and the
      # installer's bytes, so a key pair that does not match fails the release here, not on every installed PC.
      - name: Write latest.json
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NSIS: ${{ steps.installer.outputs.nsis }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          ver=$(jq -r .version apps/desktop/src-tauri/tauri.conf.json | tr -d '\r')
          pubkey=$(jq -r .plugins.updater.pubkey apps/desktop/src-tauri/tauri.conf.json | tr -d '\r')
          bun .github/scripts/latest-json.ts --version "$ver" --installer "LocalTugboat_${ver}_x64-setup.exe" --installer-file "out/LocalTugboat_${ver}_x64-setup.exe" --sig "$NSIS.sig" --pubkey "$pubkey" --repo "$REPO" --out out/latest.json
          cat out/latest.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: out/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  release:
    # Tags only. Never on pull requests or manual runs.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-installer
          path: installer

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          BUILT_SHA: ${{ github.sha }}
        run: |
          set -eu
          shopt -s nullglob
          files=(installer/*-setup.exe)
          sums=(installer/*.sha256)
          manifests=(installer/*.json)
          if [ "${#files[@]}" -ne 1 ] || [ "${#sums[@]}" -ne 1 ] || [ "${#manifests[@]}" -ne 1 ] || [ "${manifests[0]##*/}" != "latest.json" ]; then
            echo "::error::Expected exactly one installer, one .sha256 and one latest.json, found ${#files[@]}, ${#sums[@]} and ${#manifests[@]}"
            exit 1
          fi
          # latest.json must announce the version of the tag it is attached to.
          announced=$(jq -r .version "${manifests[0]}" | tr -d '\r')
          if [ "$announced" != "${TAG#v}" ]; then
            echo "::error::latest.json announces '$announced' but the tag is $TAG"
            exit 1
          fi
          st=$(gh api "repos/$GH_REPO/compare/main...$TAG" --jq .status)
          case "$st" in
            identical|behind) ;;
            *) echo "::error::TAG $TAG IS NOT ON main (compare status: $st)"; exit 1 ;;
          esac
          # The tag must still point at the commit this run built (an annotated tag resolves to its commit).
          tag_sha=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
          if [ "$tag_sha" != "$BUILT_SHA" ]; then
            echo "::error::TAG $TAG MOVED - it points at $tag_sha, this run built $BUILT_SHA"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::RELEASE $TAG ALREADY EXISTS - delete that draft on GitHub, then re-run"
            exit 1
          fi
          cat > notes.md <<'EOF'
          Windows installer for Local Tugboat (per-machine install, needs administrator approval).

          The installer is not code-signed yet. Windows may warn: More info > Run anyway.

          SHA-256: see the .sha256 file.

          latest.json is what the app's update check reads: leave it attached.

          Android: Google Play (link added when published).
          EOF
          # A tag with a suffix (v0.4.0-rc.1) is a pre-release: GitHub's "latest release" never returns one, so
          # installed PCs are not offered it unless the pre-release box is unticked on purpose.
          pre=()
          case "$TAG" in
            *-*) pre=(--prerelease) ;;
          esac
          gh release create "$TAG" "${files[0]}" "${sums[0]}" "${manifests[0]}" --draft --verify-tag ${pre[@]+"${pre[@]}"} --title "$TAG" --notes-file notes.md
