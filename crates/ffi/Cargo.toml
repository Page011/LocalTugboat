[package]
name = "tugboat-ffi"
description = "Tugboat phone core for Android: UniFFI bindings over tugboat-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# cdylib = libtugboat_ffi.so for Android; lib = the host test and the bindgen binary.
crate-type = ["cdylib", "lib"]

# Host-only helper that generates the Kotlin bindings (needs --features bindgen).
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli", "uniffi/cargo-metadata"]

[dependencies]
tugboat-core = { path = "../core" }
tugboat-net = { path = "../net" }
# Pinned exactly: the generated Kotlin must match the .so.
uniffi = { version = "=0.32.2", default-features = false }
tokio = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "std"] }
getrandom = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
